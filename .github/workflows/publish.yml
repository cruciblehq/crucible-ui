name: Publish to npm

on:
  release:
    types: [released]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Download release asset
        run: |
          ASSET_URL=$(gh release view ${{ github.event.release.tag_name }} --json assets -q '.assets[] | select(.name == "crucible-ui.zip") | .url')
          curl -L -o crucible-ui.zip -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "$ASSET_URL"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Unzip artifact
        run: unzip crucible-ui.zip -d crucible-ui

      - name: Publish to npm
        working-directory: crucible-ui
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
