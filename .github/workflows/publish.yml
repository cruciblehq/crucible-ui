name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Download tarball
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"  # Remove 'v' prefix
          TARBALL_NAME="cruciblehq-ui-${VERSION}.tgz"
          curl -L -o "$TARBALL_NAME" "https://github.com/${{ github.repository }}/releases/download/$TAG/$TARBALL_NAME"
          echo "TARBALL_NAME=$TARBALL_NAME" >> $GITHUB_ENV

      - name: Publish to npm
        run: |
          TAG="${{ github.event.release.tag_name }}"

          # Determine npm tag based on git tag pattern
          if [[ "$TAG" == *"-alpha."* ]]; then
            NPM_TAG="alpha"
          elif [[ "$TAG" == *"-beta."* ]]; then
            NPM_TAG="beta"
          elif [[ "$TAG" == *"-rc."* ]]; then
            NPM_TAG="rc"
          else
            NPM_TAG="latest"
          fi

          echo "Publishing with npm tag: $NPM_TAG"
          npm publish "$TARBALL_NAME" --provenance --access public --tag "$NPM_TAG"
